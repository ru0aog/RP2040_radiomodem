; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
core_dir = C:\VSCodePortable\data\.platformio  ; Жестко перенаправляет кэш и ядра на локальный диск C

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
monitor_filters = send_on_enter
upload_protocol = mbed
board_build.usb_mesh = tinyusb
board_build.usb_stack = tinyusb
build_flags = 
    -D USE_TINYUSB
lib_deps =
    C:\VSCodePortable\my_projects\Pico_Test\lib\arduino-audio-tools-main.zip
