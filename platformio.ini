; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]  
core_dir = C:\VSCodePortable\data\.platformio  ; Жестко перенаправляет кэш и ядра на локальный диск C  
src_dir = .                                     ; скетч RP2040_radiomodem.cpp лежит в корне

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
monitor_filters = send_on_enter
upload_protocol = mbed
board_build.usb_mesh = tinyusb
board_build.usb_stack = tinyusb
build_flags =  
    -D USE_TINYUSB  
    -Wl,-Map,firmware.map
lib_deps = https://github.com/pschatzmann/arduino-audio-tools
build_src_filter =  
    +<RP2040_radiomodem.cpp>  
    +<src/>